<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24201a">
  <title>Sign up | StudySwipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <header class="signup-header">
    <a class="signup-logo" href="index.html">StudySwipe</a>
    <nav class="signup-nav"><a href="login.html">Log in</a><a class="signup-back" href="index.html">← Back to intro</a></nav>
  </header>
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
      <p class="pixel-eyebrow">CREATE YOUR PLAYER PROFILE</p>
      <h1 id="signup-title">Create your StudySwipe account</h1>
      <p class="signup-intro">Start with the basics. You can add more to your profile later.</p>
      <form id="signup-form" class="signup-form">
        <label>Username
          <input name="username" autocomplete="username" placeholder="Choose a username" required>
        </label>
        <label>Name
          <input name="name" autocomplete="name" placeholder="Your name" required>
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        </label>
        <label>School
          <input name="school" autocomplete="organization" placeholder="Your school or college" required>
        </label>
        <label>Program
          <input name="program" placeholder="Your program of study" required>
        </label>
        <label>Age
          <input name="age" type="number" min="13" max="120" inputmode="numeric" placeholder="Your age" required>
        </label>
        <label>Languages
          <input name="languages" placeholder="English, French" required>
        </label>
        <button class="signup-submit" type="submit">Create account</button>
      </form>
      <p id="signup-status" class="signup-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="signup.js"></script>
</body>
</html>
